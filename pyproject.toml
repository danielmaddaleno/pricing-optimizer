[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pricing-optimizer"
version = "0.1.0"
description = "Price elasticity estimation and margin-optimal pricing engine"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true

[tool.black]
line-length = 120
target-version = ["py310"]
